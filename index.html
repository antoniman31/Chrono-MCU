<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#121316">
  <title>Chrono-MCU</title>
  <link rel="stylesheet" href="css/style.css?v=__BUILD__">
</head>
<body>
  <main id="app">
    <header class="top">
      <h1>Chrono-MCU</h1>
      <div class="data-actions">
        <button type="button" id="export">Exporter</button>
        <label class="button" for="import">Importer</label>
        <input type="file" id="import" accept="application/json,.json" hidden>
      </div>
    </header>
    <p id="message" role="status" hidden></p>
    <section id="progress" aria-label="Progression"></section>
    <section id="banners"></section>
    <section class="controls" aria-label="Affichage">
      <label class="search">Recherche
        <input type="search" id="search" placeholder="Titre ou épisode…" autocomplete="off">
      </label>
      <div class="seg" role="group" aria-label="Ordre">
        <button type="button" data-order="chrono">Chronologique</button>
        <button type="button" data-order="release">Sortie</button>
      </div>
      <label>Phase
        <select id="filter-phase"><option value="">Toutes</option></select>
      </label>
      <label>Type
        <select id="filter-type">
          <option value="">Tous</option>
          <option value="film">Films</option>
          <option value="serie">Séries</option>
        </select>
      </label>
      <label class="check"><input type="checkbox" id="group-phase"> Grouper par phase</label>
      <label class="check"><input type="checkbox" id="hide-done"> Masquer les terminés</label>
      <label class="check" id="posters-toggle" hidden><input type="checkbox" id="show-posters"> Afficher les affiches</label>
    </section>
    <section id="stats" aria-label="Statistiques"></section>
    <ol id="list" class="list"></ol>
    <div id="undo" role="status" hidden>
      <span id="undo-text"></span>
      <button type="button" id="undo-btn">Annuler</button>
    </div>
    <footer id="credits" hidden>
      <p class="muted">Affiches : <a href="https://www.themoviedb.org" target="_blank" rel="noopener">TMDB</a>. This product uses the TMDB API but is not endorsed or certified by TMDB.</p>
    </footer>
    <p id="version" class="muted"></p>
  </main>
  <script type="module" src="js/app.js?v=__BUILD__"></script>
</body>
</html>
