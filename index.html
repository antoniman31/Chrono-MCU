    <div class="content">
      <header class="appbar">
        <div class="appbar-in">
          <h1><button type="button" class="logo-btn" id="logo-btn" data-fk="logo" aria-label="Chrono-MCU, revenir en haut de la liste"><span class="logo">Chrono-MCU</span></button></h1>
          <button type="button" class="icon-btn" id="theme-toggle" data-fk="theme-toggle"><span class="face"></span></button>
          <span class="sr-only" id="theme-status" role="status"></span>
        </div>
      </header>

      <main id="main" tabindex="-1">
        <noscript><p class="noscript">Chrono-MCU a besoin de JavaScript pour fonctionner. Active-le dans ton navigateur, puis recharge la page.</p></noscript>
        <p id="message" role="status" hidden></p>

        <section id="screen-voir" class="screen" aria-labelledby="h-voir">
          <h2 id="h-voir" class="sr-only" tabindex="-1">À voir</h2>
          <div id="nudge"></div>
          <div id="resume"></div>
          <div class="searchbar">
            <svg class="icon" aria-hidden="true"><use href="#i-search"/></svg>
            <input type="search" id="search" placeholder="Rechercher un titre" aria-label="Rechercher un titre" autocomplete="off" enterkeyhint="search">
            <button type="button" class="icon-btn" id="search-clear" aria-label="Effacer la recherche" hidden>
              <span class="face"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></span>
            </button>
          </div>
          <div class="tabs" role="tablist" aria-label="Type de titre" id="tabs">
            <button type="button" class="tab" role="tab" id="tab-all" data-tab="all" aria-controls="list-panel">Tout</button>
            <button type="button" class="tab" role="tab" id="tab-film" data-tab="film" aria-controls="list-panel">Films</button>
            <button type="button" class="tab" role="tab" id="tab-serie" data-tab="serie" aria-controls="list-panel">Séries</button>
          </div>
          <div class="toolbar">
            <button type="button" class="btn btn-tonal" id="open-filters" aria-haspopup="dialog">
              <span class="face"><svg class="icon" aria-hidden="true"><use href="#i-tune"/></svg><span>Filtres</span><span class="count" id="filter-count" hidden></span></span>
            </button>
            <div class="seg" role="group" aria-label="Ordre d'affichage">
              <button type="button" data-order="chrono"><span class="face">Chrono</span></button>
              <button type="button" data-order="release"><span class="face">Sortie</span></button>
            </div>
          </div>
          <div class="phasebar" id="phasebar">
            <div class="phase-tabs" role="tablist" aria-label="Phases" id="phase-tabs"></div>
            <p class="phase-info" id="phase-info"><strong></strong><span></span></p>
          </div>
          <p id="result-count" class="muted result-count" role="status" aria-live="polite"></p>
          <div id="list-panel" role="tabpanel" tabindex="-1"><div id="list"></div></div>
        </section>

        <section id="screen-progression" class="screen" aria-labelledby="h-progression" hidden>
          <h2 id="h-progression" tabindex="-1">Progression</h2>
          <div id="progress-screen"></div>
        </section>

        <section id="screen-reglages" class="screen" aria-labelledby="h-reglages" hidden>
          <h2 id="h-reglages" tabindex="-1">Réglages</h2>
          <div id="settings-screen"></div>
        </section>
      </main>
    </div>

    <aside class="detail-pane" id="detail-pane" aria-label="Fiche du titre"></aside>
  </div>

  <dialog id="sheet" class="sheet" aria-labelledby="sheet-title">
    <div class="sheet-handle" id="sheet-handle" aria-hidden="true"><span></span></div>
    <div class="sheet-hero" id="sheet-hero" hidden></div>
    <div class="sheet-head">
      <h2 id="sheet-title"></h2>
      <button type="button" class="icon-btn" id="sheet-close" aria-label="Fermer">
        <span class="face"><svg class="icon" aria-hidden="true"><use href="#i-close"/></svg></span>
      </button>
    </div>
    <div class="sheet-body" id="sheet-body"></div>
  </dialog>

  <div id="snackbar" class="snackbar" hidden>
    <span id="snackbar-text" role="status" aria-live="polite"></span>
    <button type="button" class="btn btn-text" id="snackbar-action"><span class="face">Annuler</span></button>
  </div>

  <div id="achv-toast" class="snackbar achv-toast" hidden>
    <span id="achv-medal" class="medal l3" aria-hidden="true"></span>
    <span id="achv-text" role="status" aria-live="polite"><span class="kicker" id="achv-kicker"></span><b id="achv-name"></b></span>
    <button type="button" class="btn btn-text" id="achv-view"><span class="face">Voir</span></button>
    <i class="timer" aria-hidden="true"></i>
  </div>

  <div id="update-toast" class="snackbar update-toast" hidden>
    <span id="update-text" role="status" aria-live="polite">Une nouvelle version est disponible.</span>
    <button type="button" class="btn btn-text" id="update-later"><span class="face">Plus tard</span></button>
    <button type="button" class="btn btn-text" id="update-reload"><span class="face">Recharger</span></button>
  </div>

  <input type="file" id="import-file" accept="application/json,.json" hidden>
