name: Synchronisation du catalogue (TMDB et TVmaze)

on:
  schedule:
    - cron: '41 5 1 * *'
  workflow_dispatch:

# Une seule synchronisation à la fois ; une exécution en cours n'est jamais annulée
concurrency:
  group: catalog-sync
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      issues: write
    env:
      TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - name: Synchroniser le catalogue
        run: node scripts/sync-catalog.mjs --write --report "$RUNNER_TEMP/sync-report.md"
      - name: Compléter affiches, résumés et titres français (clé TMDB requise)
        if: env.TMDB_API_KEY != ''
        run: |
          node scripts/fetch-posters.mjs
          node scripts/fetch-posters.mjs --details
      - name: Aligner les durées sur TVmaze
        run: node scripts/check-data.mjs --write
      - name: Valider les données et lancer les tests
        run: |
          npm run validate
          npm test
      - name: Ouvrir une pull request si le catalogue a changé
        run: |
          if git diff --quiet -- data/; then
            echo "Catalogue déjà à jour."
            exit 0
          fi
          BRANCH="bot/catalog-sync-$(date +%Y%m%d-%H%M)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$BRANCH"
          git add data/
          git commit -m "Catalogue : synchronisation TMDB et TVmaze"
          git push origin "$BRANCH"
          {
            cat "$RUNNER_TEMP/sync-report.md"
            echo
            echo "À relire avant de fusionner : ordre chronologique (\`chronoOrder\`), phase, scènes post-générique (\`postCredits\`) et personnages (\`heroes\`) ne viennent d'aucune source. Un titre à ne plus proposer : ajouter son identifiant TMDB dans \`data/sync-ignore.json\` (\`{ \"tmdbIds\": [123] }\`)."
          } > "$RUNNER_TEMP/pr-body.md"
          if ! gh pr create --draft --base main --head "$BRANCH" --title "Catalogue : synchronisation TMDB et TVmaze" --body-file "$RUNNER_TEMP/pr-body.md"; then
            # Réglage « Autoriser GitHub Actions à créer des pull requests » désactivé : on laisse la branche et on prévient par une issue
            gh issue create --title "Catalogue : modifications prêtes sur $BRANCH" --body-file "$RUNNER_TEMP/pr-body.md"
          fi
