name: Tests et déploiement Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Lecture seule par défaut ; seul le job de déploiement reçoit les droits Pages
permissions:
  contents: read

# Un nouveau push sur une PR annule le run précédent de cette PR ; un run sur main n'est jamais annulé
# (avant, tous les runs partageaient un seul groupe : une PR pouvait interrompre un déploiement en cours)
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
      - run: npm run validate
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache de Chromium (évite le téléchargement à chaque exécution)
        id: chromium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.chromium-cache.outputs.cache-hit != 'true'
        # Sans --with-deps : l'image ubuntu-latest a déjà les bibliothèques de Chromium, et l'étape apt (miroir Azure)
        # peut se figer plusieurs minutes. --only-shell : variante sans interface, plus légère, suffisante en headless.
        run: npx playwright install --only-shell chromium
      - name: Accessibilité (axe-core), cibles tactiles et clavier, 3 thèmes x 3 largeurs
        run: npm run e2e

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Un seul déploiement à la fois, sans jamais en interrompre un en cours
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: mkdir _site && cp -r index.html manifest.webmanifest css js data icons _site/
      - name: Versionner les fichiers (évite le cache navigateur de 10 min de GitHub Pages)
        run: |
          BUILD="${GITHUB_SHA::7}"
          grep -rl '__BUILD__' _site | xargs sed -i "s/__BUILD__/${BUILD}/g"
          if grep -rq '__BUILD__' _site; then echo 'Marqueur __BUILD__ restant'; exit 1; fi
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5.0.0
      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3.0.1
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
