name: Tests et déploiement Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# Lecture seule par défaut ; seul le job de déploiement reçoit les droits Pages
permissions:
  contents: read

# Un nouveau push sur une PR annule le run précédent de cette PR ; un run sur main n'est jamais annulé
# (avant, tous les runs partageaient un seul groupe : une PR pouvait interrompre un déploiement en cours)
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - run: npm ci
      - run: npm run lint
      - run: npm run validate
      - run: npm test

  # Règle commune « CI, trois niveaux » (16/11/2026) : une PR qui ne touche que des .md n'a rien à donner aux contrôles
  # lourds, qui sont alors marqués « sautés » (un job sauté compte comme réussi pour les contrôles obligatoires).
  # Sur main et au lancement manuel, tout tourne toujours.
  changements:
    name: Fichiers touchés
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      code: ${{ steps.tri.outputs.code }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 2
      - id: tri
        env:
          EVENEMENT: ${{ github.event_name }}
        run: |
          if [ "$EVENEMENT" != pull_request ]; then echo code=true >> "$GITHUB_OUTPUT"; exit 0; fi
          # Le commit de fusion d'une PR a pour premier parent la pointe de main : leur écart est exactement la PR.
          fichiers=$(git diff --name-only HEAD^1 HEAD)
          printf '%s\n' "$fichiers"
          if printf '%s\n' "$fichiers" | grep -qvE '\.md$'; then echo code=true; else echo code=false; fi >> "$GITHUB_OUTPUT"

  e2e:
    needs: changements
    if: needs.changements.outputs.code == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache de Chromium (évite le téléchargement à chaque exécution)
        id: chromium-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.chromium-cache.outputs.cache-hit != 'true'
        # Sans --with-deps : l'image ubuntu-latest a déjà les bibliothèques de Chromium, et l'étape apt (miroir Azure)
        # peut se figer plusieurs minutes. --only-shell : variante sans interface, plus légère, suffisante en headless.
        run: npx playwright install --only-shell chromium
      - name: Accessibilité (axe-core), cibles tactiles et clavier, 3 thèmes x 3 largeurs
        run: npm run e2e

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    # Un seul déploiement à la fois, sans jamais en interrompre un en cours
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment-retry.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - run: mkdir _site && cp -r index.html manifest.webmanifest sw.js css js data icons fonts _site/
      - name: Versionner les fichiers (évite le cache navigateur de 10 min de GitHub Pages)
        run: |
          BUILD="${GITHUB_SHA::7}"
          grep -rl '__BUILD__' _site | xargs sed -i "s/__BUILD__/${BUILD}/g"
          if grep -rq '__BUILD__' _site; then echo 'Marqueur __BUILD__ restant'; exit 1; fi
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: _site
      # GitHub peut répondre « artefact introuvable » juste après l'envoi (21/11/2026) : une seconde tentative, la seule qui compte si elle échoue aussi
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
        continue-on-error: true
      - name: Attendre avant de relancer le déploiement
        if: steps.deployment.outcome == 'failure'
        run: sleep 20
      - id: deployment-retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
