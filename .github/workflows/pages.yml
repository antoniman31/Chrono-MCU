name: Tests et déploiement Pages

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm run validate
      - run: npm test

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Cache de Chromium (évite le téléchargement à chaque exécution)
        id: chromium-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: chromium-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
      - if: steps.chromium-cache.outputs.cache-hit != 'true'
        # Sans --with-deps : l'image ubuntu-latest a déjà les bibliothèques de Chromium, et l'étape apt (miroir Azure)
        # peut se figer plusieurs minutes. --only-shell : variante sans interface, plus légère, suffisante en headless.
        run: npx playwright install --only-shell chromium
      - name: Accessibilité (axe-core), cibles tactiles et clavier, 3 thèmes x 3 largeurs
        run: npm run e2e

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: [test, e2e]
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - run: mkdir _site && cp -r index.html manifest.webmanifest css js data icons _site/
      - name: Versionner les fichiers (évite le cache navigateur de 10 min de GitHub Pages)
        run: |
          BUILD="${GITHUB_SHA::7}"
          grep -rl '__BUILD__' _site | xargs sed -i "s/__BUILD__/${BUILD}/g"
          if grep -rq '__BUILD__' _site; then echo 'Marqueur __BUILD__ restant'; exit 1; fi
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
