# Mises à jour hebdomadaires : les actions GitHub (épinglées par SHA, Dependabot met à jour le SHA et le commentaire de version)
# et les dépendances de développement. Chaque mise à jour passe par la CI (tests, e2e) avant de pouvoir être fusionnée.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    # Une seule PR pour toutes les actions : celles du déploiement (configure-pages, upload-pages-artifact, deploy-pages)
    # doivent monter ensemble, et ce chemin ne tourne que sur main (la CI d'une PR ne l'exerce pas)
    groups:
      actions:
        patterns: ["*"]
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      dev-dependencies:
        dependency-type: development
